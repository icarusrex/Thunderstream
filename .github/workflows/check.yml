name: Check Thunderstream
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: python3 tests/package_validation_test.py
      - run: python3 tests/gmail_helper_test.py
      - run: python3 -m unittest discover -s tests -p appearance_install_test.py
      - run: python3 scripts/validate.py
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: thunderstream-pre-release
          path: dist/*.xpi
